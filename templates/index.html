<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADKwx</title>
    <style>
        :root {
            --bg: #eef4f8;
            --bg-accent: #dbe6ee;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --surface-border: rgba(104, 128, 150, 0.18);
            --text: #183042;
            --muted: #587082;
            --header-start: #0f3b52;
            --header-end: #1f6b78;
            --accent: #4d9ab0;
            --accent-strong: #2b6c7a;
            --label-bg: rgba(15, 59, 82, 0.84);
            --shadow: 0 18px 40px rgba(24, 48, 66, 0.12);
        }
        body {
            margin: 0;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(112, 173, 192, 0.2), transparent 32%),
                linear-gradient(180deg, var(--bg) 0%, #f7fafc 100%);
        }
        header {
            background: linear-gradient(135deg, var(--header-start), var(--header-end));
            color: white;
            padding: 14px 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            height: 72px;
            box-sizing: border-box;
            box-shadow: 0 10px 24px rgba(15, 59, 82, 0.18);
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 72px);
        }
        /* slightly narrower left side to give more room for images */
        .left-side {
            width: 150px; /* slightly narrower to give more room */
            background:
                linear-gradient(180deg, rgba(31, 107, 120, 0.12), rgba(255, 255, 255, 0.35)),
                linear-gradient(135deg, #dbe7ef, #eff5f8);
            border-right: 1px solid var(--surface-border);
            box-sizing: border-box;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        /* slide holder */
        .slider-container {
            flex: 1;
            padding: 18px;
            overflow: auto; /* allow scroll on small screens */
        }
        /* hidden by default; active becomes a 2x2 grid filling most of the view */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            gap: 12px;
            box-sizing: border-box;
        }
        .slide.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* slightly smaller rows so panels are a bit reduced */
            grid-template-rows: minmax(320px, 1fr) minmax(320px, 1fr);
            gap: 10px;
            align-items: stretch;
        }
        .panel {
            position: relative;
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            min-height: 320px; /* reduced size */
        }
        .panel-label {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--label-bg);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        /* let PNGs fill the panel as much as possible while preserving aspect */
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        .slider-controls {
            text-align: center;
            padding: 14px 18px 18px;
            background: rgba(255, 255, 255, 0.74);
            border-top: 1px solid var(--surface-border);
            box-shadow: 0 -8px 24px rgba(24, 48, 66, 0.05);
            backdrop-filter: blur(10px);
        }
        .slider-bar {
            width: 80%;
            max-width: 1200px;
            accent-color: var(--accent-strong);
        }
        .forecast-hour {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-strong);
            letter-spacing: 0.04em;
        }

        @media (max-width: 1100px) {
            .left-side { display: none; }
            .slide.active { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(260px, auto) minmax(260px, auto); }
            .panel { min-height: 260px; }
        }
        /* keep 2x2 on small phones like iPhone, reduce heights so it fits */
        @media (max-width: 420px) {
            .left-side { display: none; }
            .slide.active { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(160px, auto) minmax(160px, auto); gap:8px; }
            .panel { min-height: 160px; padding:4px; }
        }
        @media (max-width: 320px) {
            .slide.active { grid-template-rows: minmax(140px, auto) minmax(140px, auto); }
            .panel { min-height: 140px; }
        }
    </style>
</head>
<body>
    <header>ADKwx</header>
    <div class="container">
        <div class="left-side">
            <!-- empty left area -->
        </div>
        <div class="main-content">
            <div class="slider-container">
                {% for slide in slides %}
                <div class="slide{% if loop.first %} active{% endif %}" data-index="{{ slide.index }}">
                    {# render panels in the same order as groups in app.py #}
                    {% for group in groups %}
                    {% set image = slide.images.get(group) %}
                    <div class="panel">
                        <div class="panel-label">{{ group }}</div>
                        {% if image %}
                        <img src="{{ url_for('serve_png', group=group, filename=image.filename, v=image.version) }}" alt="Forecast {{ group }}">
                        {% else %}
                        <div class="empty">No image for {{ group }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
            <div class="slider-controls">
                <input type="range" class="slider-bar" min="0" max="{{ slides|length - 1 }}" value="0" id="sliderBar">
                <div class="forecast-hour" id="forecastHour">Forecast Hour: 000</div>
            </div>
        </div>
    </div>
    <script>
        const slides = Array.from(document.querySelectorAll('.slide'));
        const sliderBar = document.getElementById('sliderBar');
        const forecastHour = document.getElementById('forecastHour');

        function formatIndex(idx) {
            return (/^\d+$/).test(idx) ? String(idx).padStart(3,'0') : idx;
        }

        function showSlide(index) {
            slides.forEach((s, i) => s.classList.toggle('active', i === index));
            const idx = slides[index] && slides[index].dataset.index ? slides[index].dataset.index : '';
            forecastHour.textContent = `Forecast Hour: ${formatIndex(idx)}`;
        }

        sliderBar.addEventListener('input', (event) => {
            showSlide(parseInt(event.target.value, 10));
        });

        // initialize
        if (slides.length) showSlide(0);
    </script>
</body>
</html>
