<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADKwx</title>
    <style>
        :root {
            --header-height: 72px;
            --controls-height: 76px;
            --bg: #eef4f8;
            --bg-accent: #dbe6ee;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --surface-border: rgba(104, 128, 150, 0.18);
            --text: #183042;
            --muted: #587082;
            --header-start: #0f3b52;
            --header-end: #1f6b78;
            --accent: #4d9ab0;
            --accent-strong: #2b6c7a;
            --label-bg: rgba(15, 59, 82, 0.84);
            --shadow: 0 18px 40px rgba(24, 48, 66, 0.12);
        }
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100%;
            margin: 0;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, rgba(112, 173, 192, 0.2), transparent 32%),
                linear-gradient(180deg, var(--bg) 0%, #f7fafc 100%);
        }
        header {
            background: linear-gradient(135deg, var(--header-start), var(--header-end));
            color: white;
            padding: 14px 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            min-height: var(--header-height);
            box-sizing: border-box;
            box-shadow: 0 10px 24px rgba(15, 59, 82, 0.18);
        }
        .container {
            display: flex;
            flex-direction: row;
            min-height: calc(100vh - var(--header-height));
            min-height: calc(100dvh - var(--header-height));
        }
        /* slightly narrower left side to give more room for images */
        .left-side {
            width: 150px; /* slightly narrower to give more room */
            background:
                linear-gradient(180deg, rgba(31, 107, 120, 0.12), rgba(255, 255, 255, 0.35)),
                linear-gradient(135deg, #dbe7ef, #eff5f8);
            border-right: 1px solid var(--surface-border);
            box-sizing: border-box;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        /* slide holder */
        .slider-container {
            flex: 1;
            padding: 18px;
            overflow: auto; /* allow scroll on small screens */
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        /* hidden by default; active becomes a 2x2 grid filling most of the view */
        .slide {
            display: none;
            width: 100%;
            min-height: 100%;
            gap: 12px;
            box-sizing: border-box;
        }
        .slide.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: minmax(0, 1fr);
            gap: 10px;
            align-items: stretch;
        }
        .panel {
            position: relative;
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            min-height: 320px; /* reduced size */
        }
        .panel-header {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .panel-label {
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--label-bg);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .panel-select {
            min-width: 108px;
            border: 1px solid rgba(15, 59, 82, 0.16);
            border-radius: 999px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }
        /* let PNGs fill the panel as much as possible while preserving aspect */
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .panel img.is-hidden,
        .empty.is-hidden {
            display: none;
        }
        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        .slider-controls {
            text-align: center;
            padding: 14px 18px 18px;
            min-height: var(--controls-height);
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.74);
            border-top: 1px solid var(--surface-border);
            box-shadow: 0 -8px 24px rgba(24, 48, 66, 0.05);
            backdrop-filter: blur(10px);
        }
        .slider-bar {
            width: 80%;
            max-width: 1200px;
            accent-color: var(--accent-strong);
        }
        .forecast-hour {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-strong);
            letter-spacing: 0.04em;
        }

        @media (max-width: 1100px) {
            .left-side { display: none; }
            .slide.active { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(260px, auto); }
            .panel { min-height: 260px; }
        }
        @media (max-width: 820px) {
            :root {
                --header-height: 64px;
                --controls-height: 68px;
            }
            header {
                padding: 16px;
                font-size: 22px;
                letter-spacing: 0.05em;
            }
            .container {
                overflow: hidden;
            }
            .main-content {
                overflow: hidden;
            }
            .slider-container {
                padding: 12px;
                overflow: hidden;
            }
            .slider-controls {
                padding: 12px;
            }
            .slider-bar {
                width: 100%;
            }
            .slide.active {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                grid-auto-rows: auto;
                height: calc(100dvh - var(--header-height) - var(--controls-height) - 24px);
            }
            .panel {
                min-height: 0;
            }
            .panel-header {
                flex-wrap: nowrap;
                align-items: center;
                gap: 6px;
            }
            .panel-select {
                min-width: 0;
                width: auto;
                max-width: 58%;
            }
        }
        @media (max-width: 820px) and (orientation: landscape) {
            .slide.active {
                height: auto;
            }
            .slider-container {
                overflow: auto;
            }
        }
        /* Keep the full 2x2 visible on portrait phones and leave room for the slider. */
        @media (max-width: 420px) and (orientation: portrait) {
            :root {
                --header-height: 56px;
                --controls-height: 60px;
            }
            .left-side { display: none; }
            header {
                padding-top: calc(12px + env(safe-area-inset-top));
                padding-left: max(14px, env(safe-area-inset-left));
                padding-right: max(14px, env(safe-area-inset-right));
                font-size: 20px;
            }
            .container {
                min-height: calc(100svh - var(--header-height));
            }
            .slider-container {
                padding: 6px;
            }
            .slide.active {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                grid-auto-rows: auto;
                gap: 6px;
                height: calc(100svh - var(--header-height) - var(--controls-height) - 12px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            }
            .panel {
                min-height: 0;
                padding: 4px;
                border-radius: 14px;
            }
            .panel-header {
                top: 6px;
                left: 6px;
                right: 6px;
                gap: 4px;
            }
            .panel-label {
                font-size: 10px;
                padding: 4px 6px;
            }
            .panel-select {
                max-width: 56%;
                font-size: 10px;
                padding: 4px 6px;
            }
            .slider-controls {
                padding-top: 8px;
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
            .forecast-hour {
                margin-top: 6px;
                font-size: 12px;
            }
        }
        @media (max-width: 320px) {
            :root {
                --header-height: 52px;
                --controls-height: 54px;
            }
            .slide.active {
                gap: 4px;
            }
            .panel {
                min-height: 0;
            }
            .panel-label,
            .panel-select {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header>ADKwx</header>
    <div class="container">
        <div class="left-side">
            <!-- empty left area -->
        </div>
        <div class="main-content">
            <div class="slider-container">
                {% for slide in slides %}
                <div class="slide{% if loop.first %} active{% endif %}" data-index="{{ slide.index }}">
                    {% for group in default_panel_groups %}
                    {% set panel_index = loop.index0 %}
                    {% set image = slide.images.get(group) %}
                    <div class="panel" data-panel-index="{{ panel_index }}">
                        <div class="panel-header">
                            <div class="panel-label">Panel {{ panel_index + 1 }}</div>
                            <select class="panel-select" data-panel-index="{{ panel_index }}" aria-label="Choose image for panel {{ panel_index + 1 }}">
                                {% for option_group in groups %}
                                <option value="{{ option_group }}"{% if option_group == group %} selected{% endif %}>{{ option_group }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <img
                            {% if image %}src="{{ url_for('serve_png', group=group, filename=image.filename, v=image.version) }}"{% endif %}
                            alt="Forecast {{ group }}"
                            class="panel-image{% if not image %} is-hidden{% endif %}"
                        >
                        <div class="empty{% if image %} is-hidden{% endif %}">No image for {{ group }}</div>
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
            <div class="slider-controls">
                <input type="range" class="slider-bar" min="0" max="{{ slides|length - 1 }}" value="0" id="sliderBar">
                <div class="forecast-hour" id="forecastHour">Forecast Hour: 000</div>
            </div>
        </div>
    </div>
    <script id="slideData" type="application/json">{{ slides | tojson }}</script>
    <script id="defaultPanelGroups" type="application/json">{{ default_panel_groups | tojson }}</script>
    <script>
        const sliderContainer = document.querySelector('.slider-container');
        const allGroups = Array.from(
            new Set(
                Array.from(document.querySelectorAll('.panel-select option')).map((option) => option.value)
            )
        );
        const slideDataElement = document.getElementById('slideData');
        const defaultPanelGroupsElement = document.getElementById('defaultPanelGroups');
        let slideData = slideDataElement ? JSON.parse(slideDataElement.textContent) : [];
        const defaultPanelGroups = defaultPanelGroupsElement ? JSON.parse(defaultPanelGroupsElement.textContent) : [];
        const sliderBar = document.getElementById('sliderBar');
        const forecastHour = document.getElementById('forecastHour');
        let lastSlideSignature = JSON.stringify(slideData);
        const REFRESH_INTERVAL_MS = 30000;
        const PANEL_SELECTIONS_KEY = 'adkwx-panel-selections-v2';
        let selectedGroups = loadSelectedGroups();
        let slideElements = [];
        let currentSlideIndex = 0;

        function loadSelectedGroups() {
            try {
                const savedSelections = JSON.parse(window.localStorage.getItem(PANEL_SELECTIONS_KEY) || 'null');
                if (Array.isArray(savedSelections) && savedSelections.length === defaultPanelGroups.length) {
                    return savedSelections;
                }
            } catch (error) {
                console.warn('Failed to load saved panel selections', error);
            }
            return [...defaultPanelGroups];
        }

        function saveSelectedGroups() {
            try {
                window.localStorage.setItem(PANEL_SELECTIONS_KEY, JSON.stringify(selectedGroups));
            } catch (error) {
                console.warn('Failed to save panel selections', error);
            }
        }

        function syncPanelSelects() {
            document.querySelectorAll('.panel').forEach((panel) => {
                const panelIndex = Number(panel.dataset.panelIndex);
                const panelSelect = panel.querySelector('.panel-select');
                const selectedGroup = selectedGroups[panelIndex] || defaultPanelGroups[panelIndex] || '';
                if (panelSelect && panelSelect.value !== selectedGroup) {
                    panelSelect.value = selectedGroup;
                }
            });
        }

        function attachPanelSelectionHandler(select) {
            const handlePanelSelection = (event) => {
                const panelIndex = Number(event.target.dataset.panelIndex);
                selectedGroups[panelIndex] = event.target.value;
                saveSelectedGroups();
                renderSlides();
            };

            select.addEventListener('input', handlePanelSelection);
            select.addEventListener('change', handlePanelSelection);
        }

        function createPanelElement(slide, panelIndex) {
            const selectedGroup = selectedGroups[panelIndex] || defaultPanelGroups[panelIndex] || '';
            const imageData = selectedGroup ? slide.images[selectedGroup] : null;

            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.dataset.panelIndex = String(panelIndex);

            const panelHeader = document.createElement('div');
            panelHeader.className = 'panel-header';

            const panelLabel = document.createElement('div');
            panelLabel.className = 'panel-label';
            panelLabel.textContent = `Panel ${panelIndex + 1}`;

            const panelSelect = document.createElement('select');
            panelSelect.className = 'panel-select';
            panelSelect.dataset.panelIndex = String(panelIndex);
            panelSelect.setAttribute('aria-label', `Choose image for panel ${panelIndex + 1}`);

            allGroups.forEach((group) => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                option.selected = group === selectedGroup;
                panelSelect.appendChild(option);
            });
            attachPanelSelectionHandler(panelSelect);

            panelHeader.appendChild(panelLabel);
            panelHeader.appendChild(panelSelect);

            const image = document.createElement('img');
            image.className = 'panel-image';
            image.alt = `Forecast ${selectedGroup}`;

            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = `No image for ${selectedGroup}`;

            if (imageData) {
                image.src = buildImageUrl(selectedGroup, imageData);
                empty.classList.add('is-hidden');
            } else {
                image.classList.add('is-hidden');
            }

            panel.appendChild(panelHeader);
            panel.appendChild(image);
            panel.appendChild(empty);
            return panel;
        }

        function renderSlides() {
            currentSlideIndex = Math.min(currentSlideIndex, Math.max(slideData.length - 1, 0));
            sliderContainer.innerHTML = '';

            slideData.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = 'slide';
                slideElement.dataset.index = slide.index;
                if (index === currentSlideIndex) {
                    slideElement.classList.add('active');
                }

                for (let panelIndex = 0; panelIndex < defaultPanelGroups.length; panelIndex += 1) {
                    slideElement.appendChild(createPanelElement(slide, panelIndex));
                }

                sliderContainer.appendChild(slideElement);
            });

            slideElements = Array.from(document.querySelectorAll('.slide'));
            sliderBar.max = String(Math.max(slideData.length - 1, 0));
            sliderBar.value = String(currentSlideIndex);

            if (slideElements.length) {
                showSlide(currentSlideIndex);
            } else {
                forecastHour.textContent = 'Forecast Hour: N/A';
            }
        }

        function buildImageUrl(group, image) {
            const filename = encodeURIComponent(image.filename);
            return `/pngs/${encodeURIComponent(group)}/${filename}?v=${encodeURIComponent(image.version)}`;
        }

        function updateSlidePanels(index) {
            const slide = slideElements[index];
            const data = slideData[index];
            if (!slide || !data) {
                return;
            }

            syncPanelSelects();

            slide.querySelectorAll('.panel').forEach((panel) => {
                const panelIndex = Number(panel.dataset.panelIndex);
                const panelSelect = panel.querySelector('.panel-select');
                const selectedGroup = selectedGroups[panelIndex] || defaultPanelGroups[panelIndex] || null;
                const imageData = selectedGroup ? data.images[selectedGroup] : null;
                const image = panel.querySelector('.panel-image');
                const empty = panel.querySelector('.empty');

                if (!selectedGroup || !image || !empty) {
                    return;
                }

                if (panelSelect) {
                    panelSelect.value = selectedGroup;
                }

                empty.textContent = `No image for ${selectedGroup}`;
                image.alt = `Forecast ${selectedGroup}`;

                if (imageData) {
                    image.src = buildImageUrl(selectedGroup, imageData);
                    image.classList.remove('is-hidden');
                    empty.classList.add('is-hidden');
                } else {
                    image.removeAttribute('src');
                    image.classList.add('is-hidden');
                    empty.classList.remove('is-hidden');
                }
            });
        }

        function formatIndex(idx) {
            return (/^\d+$/).test(idx) ? String(idx).padStart(3,'0') : idx;
        }

        function showSlide(index) {
            currentSlideIndex = Math.min(index, Math.max(slideElements.length - 1, 0));
            slideElements.forEach((s, i) => s.classList.toggle('active', i === index));
            const idx = slideElements[currentSlideIndex] && slideElements[currentSlideIndex].dataset.index ? slideElements[currentSlideIndex].dataset.index : '';
            forecastHour.textContent = `Forecast Hour: ${formatIndex(idx)}`;
            updateSlidePanels(currentSlideIndex);
        }

        async function refreshSlideData() {
            try {
                const response = await fetch('/slide-data', {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                if (!response.ok) {
                    return;
                }

                const payload = await response.json();
                const nextSlides = Array.isArray(payload.slides) ? payload.slides : [];
                const nextSignature = JSON.stringify(nextSlides);
                if (nextSignature !== lastSlideSignature) {
                    slideData = nextSlides;
                    lastSlideSignature = nextSignature;
                    renderSlides();
                } else {
                    slideData = nextSlides;
                    updateSlidePanels(currentSlideIndex);
                }
            } catch (error) {
                console.error('Failed to refresh slide data', error);
            }
        }

        sliderBar.addEventListener('input', (event) => {
            showSlide(parseInt(event.target.value, 10));
        });

        // initialize
        saveSelectedGroups();
        renderSlides();
        window.setInterval(refreshSlideData, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
