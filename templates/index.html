<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADKwx</title>
    <style>
        :root {
            --bg: #eef4f8;
            --bg-accent: #dbe6ee;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --surface-border: rgba(104, 128, 150, 0.18);
            --text: #183042;
            --muted: #587082;
            --header-start: #0f3b52;
            --header-end: #1f6b78;
            --accent: #4d9ab0;
            --accent-strong: #2b6c7a;
            --label-bg: rgba(15, 59, 82, 0.84);
            --shadow: 0 18px 40px rgba(24, 48, 66, 0.12);
        }
        body {
            margin: 0;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(112, 173, 192, 0.2), transparent 32%),
                linear-gradient(180deg, var(--bg) 0%, #f7fafc 100%);
        }
        header {
            background: linear-gradient(135deg, var(--header-start), var(--header-end));
            color: white;
            padding: 14px 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            height: 72px;
            box-sizing: border-box;
            box-shadow: 0 10px 24px rgba(15, 59, 82, 0.18);
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 72px);
        }
        /* slightly narrower left side to give more room for images */
        .left-side {
            width: 150px; /* slightly narrower to give more room */
            background:
                linear-gradient(180deg, rgba(31, 107, 120, 0.12), rgba(255, 255, 255, 0.35)),
                linear-gradient(135deg, #dbe7ef, #eff5f8);
            border-right: 1px solid var(--surface-border);
            box-sizing: border-box;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        /* slide holder */
        .slider-container {
            flex: 1;
            padding: 18px;
            overflow: auto; /* allow scroll on small screens */
        }
        /* hidden by default; active becomes a 2x2 grid filling most of the view */
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            gap: 12px;
            box-sizing: border-box;
        }
        .slide.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: minmax(320px, 1fr);
            gap: 10px;
            align-items: stretch;
        }
        .panel {
            position: relative;
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            min-height: 320px; /* reduced size */
        }
        .panel-header {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .panel-label {
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--label-bg);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .panel-select {
            min-width: 108px;
            border: 1px solid rgba(15, 59, 82, 0.16);
            border-radius: 999px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.94);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }
        /* let PNGs fill the panel as much as possible while preserving aspect */
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .panel img.is-hidden,
        .empty.is-hidden {
            display: none;
        }
        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        .slider-controls {
            text-align: center;
            padding: 14px 18px 18px;
            background: rgba(255, 255, 255, 0.74);
            border-top: 1px solid var(--surface-border);
            box-shadow: 0 -8px 24px rgba(24, 48, 66, 0.05);
            backdrop-filter: blur(10px);
        }
        .slider-bar {
            width: 80%;
            max-width: 1200px;
            accent-color: var(--accent-strong);
        }
        .forecast-hour {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-strong);
            letter-spacing: 0.04em;
        }

        @media (max-width: 1100px) {
            .left-side { display: none; }
            .slide.active { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(260px, auto); }
            .panel { min-height: 260px; }
        }
        /* keep 2x2 on small phones like iPhone, reduce heights so it fits */
        @media (max-width: 420px) {
            .left-side { display: none; }
            .slide.active { grid-template-columns: 1fr; grid-auto-rows: minmax(160px, auto); gap:8px; }
            .panel { min-height: 160px; padding:4px; }
        }
        @media (max-width: 320px) {
            .slide.active { grid-auto-rows: minmax(140px, auto); }
            .panel { min-height: 140px; }
        }
    </style>
</head>
<body>
    <header>ADKwx</header>
    <div class="container">
        <div class="left-side">
            <!-- empty left area -->
        </div>
        <div class="main-content">
            <div class="slider-container">
                {% for slide in slides %}
                <div class="slide{% if loop.first %} active{% endif %}" data-index="{{ slide.index }}">
                    {% for group in default_panel_groups %}
                    {% set panel_index = loop.index0 %}
                    {% set image = slide.images.get(group) %}
                    <div class="panel" data-panel-index="{{ panel_index }}">
                        <div class="panel-header">
                            <div class="panel-label">Panel {{ panel_index + 1 }}</div>
                            <select class="panel-select" data-panel-index="{{ panel_index }}" aria-label="Choose image for panel {{ panel_index + 1 }}">
                                {% for option_group in groups %}
                                <option value="{{ option_group }}"{% if option_group == group %} selected{% endif %}>{{ option_group }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <img
                            {% if image %}src="{{ url_for('serve_png', group=group, filename=image.filename, v=image.version) }}"{% endif %}
                            alt="Forecast {{ group }}"
                            class="panel-image{% if not image %} is-hidden{% endif %}"
                        >
                        <div class="empty{% if image %} is-hidden{% endif %}">No image for {{ group }}</div>
                    </div>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
            <div class="slider-controls">
                <input type="range" class="slider-bar" min="0" max="{{ slides|length - 1 }}" value="0" id="sliderBar">
                <div class="forecast-hour" id="forecastHour">Forecast Hour: 000</div>
            </div>
        </div>
    </div>
    <script id="slideData" type="application/json">{{ slides | tojson }}</script>
    <script>
        const slideElements = Array.from(document.querySelectorAll('.slide'));
        const slideDataElement = document.getElementById('slideData');
        const slideData = slideDataElement ? JSON.parse(slideDataElement.textContent) : [];
        const sliderBar = document.getElementById('sliderBar');
        const forecastHour = document.getElementById('forecastHour');

        function buildImageUrl(group, image) {
            const filename = encodeURIComponent(image.filename);
            return `/pngs/${encodeURIComponent(group)}/${filename}?v=${encodeURIComponent(image.version)}`;
        }

        function updateSlidePanels(index) {
            const slide = slideElements[index];
            const data = slideData[index];
            if (!slide || !data) {
                return;
            }

            slide.querySelectorAll('.panel').forEach((panel) => {
                const panelSelect = panel.querySelector('.panel-select');
                const selectedGroup = panelSelect ? panelSelect.value : null;
                const imageData = selectedGroup ? data.images[selectedGroup] : null;
                const image = panel.querySelector('.panel-image');
                const empty = panel.querySelector('.empty');

                if (!selectedGroup || !image || !empty) {
                    return;
                }

                empty.textContent = `No image for ${selectedGroup}`;
                image.alt = `Forecast ${selectedGroup}`;

                if (imageData) {
                    image.src = buildImageUrl(selectedGroup, imageData);
                    image.classList.remove('is-hidden');
                    empty.classList.add('is-hidden');
                } else {
                    image.removeAttribute('src');
                    image.classList.add('is-hidden');
                    empty.classList.remove('is-hidden');
                }
            });
        }

        function formatIndex(idx) {
            return (/^\d+$/).test(idx) ? String(idx).padStart(3,'0') : idx;
        }

        function showSlide(index) {
            slideElements.forEach((s, i) => s.classList.toggle('active', i === index));
            const idx = slideElements[index] && slideElements[index].dataset.index ? slideElements[index].dataset.index : '';
            forecastHour.textContent = `Forecast Hour: ${formatIndex(idx)}`;
            updateSlidePanels(index);
        }

        sliderBar.addEventListener('input', (event) => {
            showSlide(parseInt(event.target.value, 10));
        });

        document.querySelectorAll('.panel-select').forEach((select) => {
            select.addEventListener('change', () => {
                showSlide(parseInt(sliderBar.value, 10));
            });
        });

        // initialize
        if (slideElements.length) showSlide(0);
    </script>
</body>
</html>
