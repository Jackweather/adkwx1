<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADKwx</title>
    <style>
        :root {
            --header-height: 72px;
            --controls-height: 76px;
            --bg: #eef4f8;
            --bg-accent: #dbe6ee;
            --surface: rgba(255, 255, 255, 0.82);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --surface-border: rgba(104, 128, 150, 0.18);
            --text: #183042;
            --muted: #587082;
            --header-start: #0f3b52;
            --header-end: #1f6b78;
            --accent: #4d9ab0;
            --accent-strong: #2b6c7a;
            --label-bg: rgba(15, 59, 82, 0.84);
            --shadow: 0 18px 40px rgba(24, 48, 66, 0.12);
        }
        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }
        body {
            min-height: 100%;
            margin: 0;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background:
                radial-gradient(circle at top left, rgba(112, 173, 192, 0.2), transparent 32%),
                linear-gradient(180deg, var(--bg) 0%, #f7fafc 100%);
        }
        header {
            background: linear-gradient(135deg, var(--header-start), var(--header-end));
            color: white;
            padding: 14px 24px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            min-height: var(--header-height);
            box-sizing: border-box;
            box-shadow: 0 10px 24px rgba(15, 59, 82, 0.18);
        }
        .container {
            display: flex;
            flex-direction: row;
            min-height: calc(100vh - var(--header-height));
            min-height: calc(100dvh - var(--header-height));
        }
        /* slightly narrower left side to give more room for images */
        .left-side {
            width: 150px; /* slightly narrower to give more room */
            background:
                linear-gradient(180deg, rgba(31, 107, 120, 0.12), rgba(255, 255, 255, 0.35)),
                linear-gradient(135deg, #dbe7ef, #eff5f8);
            border-right: 1px solid var(--surface-border);
            box-sizing: border-box;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        .view-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 18px 0;
            flex-wrap: wrap;
        }
        .view-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--surface-border);
            box-shadow: 0 10px 24px rgba(24, 48, 66, 0.08);
        }
        .view-control-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-strong);
        }
        .view-select {
            min-width: 180px;
            border: 1px solid rgba(15, 59, 82, 0.16);
            border-radius: 999px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.96);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
        }
        .compare-toggle {
            border: 1px solid rgba(15, 59, 82, 0.16);
            border-radius: 999px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--accent-strong);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .compare-toggle.is-active {
            background: var(--accent-strong);
            color: white;
            border-color: var(--accent-strong);
        }
        .compare-toggle:disabled {
            opacity: 0.55;
            cursor: default;
        }
        /* slide holder */
        .slider-container {
            flex: 1;
            padding: 18px;
            overflow: auto; /* allow scroll on small screens */
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }
        /* hidden by default; active becomes a 2x2 grid filling most of the view */
        .slide {
            display: none;
            width: 100%;
            min-height: 100%;
            gap: 12px;
            box-sizing: border-box;
        }
        .slide.active {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-auto-rows: minmax(0, 1fr);
            gap: 12px;
            align-items: stretch;
        }
        .slide.active.is-compare {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .panel {
            position: relative;
            background: linear-gradient(180deg, var(--surface-strong), var(--surface));
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            padding: 10px;
            overflow: hidden;
            min-height: 320px; /* reduced size */
        }
        .panel-header {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }
        .panel-label {
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--label-bg);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        /* let PNGs fill the panel as much as possible while preserving aspect */
        .panel img {
            flex: 1;
            width: 100%;
            height: auto;
            min-height: 0;
            object-fit: contain;
            display: block;
        }
        .panel img.is-hidden,
        .empty.is-hidden {
            display: none;
        }
        .empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        .slider-controls {
            text-align: center;
            padding: 14px 18px 18px;
            min-height: var(--controls-height);
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.74);
            border-top: 1px solid var(--surface-border);
            box-shadow: 0 -8px 24px rgba(24, 48, 66, 0.05);
            backdrop-filter: blur(10px);
        }
        .slider-bar {
            width: 80%;
            max-width: 1200px;
            accent-color: var(--accent-strong);
        }
        .forecast-hour {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-strong);
            letter-spacing: 0.04em;
        }

        @media (min-width: 821px) {
            .slider-container {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .slide.active {
                width: min(100%, 820px);
                height: min(100%, calc(100dvh - var(--header-height) - var(--controls-height) - 48px));
                margin: 0 auto;
            }
            .slide.active.is-compare {
                width: min(100%, 1280px);
            }
            .panel {
                min-height: 240px;
            }
        }

        @media (max-width: 1100px) {
            .left-side { display: none; }
            .slide.active { grid-auto-rows: minmax(260px, auto); }
            .slide.active.is-compare { grid-template-columns: 1fr 1fr; }
            .panel { min-height: 260px; }
        }
        @media (max-width: 820px) {
            :root {
                --header-height: 64px;
                --controls-height: 68px;
            }
            header {
                padding: 16px;
                font-size: 22px;
                letter-spacing: 0.05em;
            }
            .container {
                overflow: hidden;
            }
            .main-content {
                overflow: hidden;
            }
            .slider-container {
                padding: 12px;
                overflow: hidden;
            }
            .view-toolbar {
                padding: 12px 12px 0;
                gap: 8px;
            }
            .view-control {
                width: 100%;
                justify-content: space-between;
            }
            .view-select {
                min-width: 0;
                flex: 1;
            }
            .compare-toggle {
                width: 100%;
            }
            .slider-controls {
                padding: 12px;
            }
            .slider-bar {
                width: 100%;
            }
            .slide.active {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr);
                grid-auto-rows: auto;
                height: calc(100dvh - var(--header-height) - var(--controls-height) - 24px);
            }
            .slide.active.is-compare {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }
            .panel {
                min-height: 0;
            }
            .panel-header {
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
            }
        }
        @media (max-width: 820px) and (orientation: landscape) {
            .slide.active {
                height: auto;
            }
            .slider-container {
                overflow: auto;
            }
        }
        /* Keep the full 2x2 visible on portrait phones and leave room for the slider. */
        @media (max-width: 420px) and (orientation: portrait) {
            :root {
                --header-height: 56px;
                --controls-height: 60px;
            }
            .left-side { display: none; }
            header {
                padding-top: calc(12px + env(safe-area-inset-top));
                padding-left: max(14px, env(safe-area-inset-left));
                padding-right: max(14px, env(safe-area-inset-right));
                font-size: 20px;
            }
            .container {
                min-height: calc(100svh - var(--header-height));
            }
            .slider-container {
                padding: 6px;
            }
            .slide.active {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr);
                grid-auto-rows: auto;
                gap: 6px;
                height: calc(100svh - var(--header-height) - var(--controls-height) - 12px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            }
            .slide.active.is-compare {
                grid-template-rows: repeat(2, minmax(0, 1fr));
            }
            .panel {
                min-height: 0;
                padding: 4px;
                border-radius: 14px;
            }
            .panel-header {
                gap: 4px;
                margin-bottom: 6px;
            }
            .panel-label {
                font-size: 10px;
                padding: 4px 6px;
            }
            .view-control {
                padding: 6px 10px;
            }
            .view-control-label {
                font-size: 10px;
            }
            .view-select,
            .compare-toggle,
            .mode-toggle {
                font-size: 10px;
                padding: 6px 8px;
            }
            .slider-controls {
                padding-top: 8px;
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
            .forecast-hour {
                margin-top: 6px;
                font-size: 12px;
            }
        }
        @media (max-width: 320px) {
            :root {
                --header-height: 52px;
                --controls-height: 54px;
            }
            .slide.active {
                gap: 4px;
            }
            .panel {
                min-height: 0;
            }
            .panel-label,
            .view-control-label,
            .view-select,
            .compare-toggle,
            .mode-toggle {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header>ADKwx</header>
    <div class="container">
        <div class="left-side">
            <!-- empty left area -->
        </div>
        <div class="main-content">
            <div class="view-toolbar">
                <label class="view-control" for="primaryGroupSelect">
                    <span class="view-control-label">Main View</span>
                    <select id="primaryGroupSelect" class="view-select" aria-label="Choose main image">
                        {% for group in groups %}
                        <option value="{{ group }}"{% if group == default_panel_groups[0] %} selected{% endif %}>{{ group_labels.get(group, group) }}</option>
                        {% endfor %}
                    </select>
                </label>
                <button type="button" class="compare-toggle mode-toggle" id="modeToggle">Show Total Precip</button>
                <button type="button" class="compare-toggle" id="compareToggle">Compare to Main NWP</button>
            </div>
            <div class="slider-container">
                {% for slide in slides %}
                <div class="slide{% if loop.first %} active{% endif %}" data-index="{{ slide.index }}">
                    {% set primary_group = default_panel_groups[0] %}
                    {% set image = slide.images.get(primary_group) %}
                    <div class="panel" data-group="{{ primary_group }}">
                        <div class="panel-header">
                            <div class="panel-label">{{ primary_group }}</div>
                        </div>
                        <img
                            {% if image %}src="{{ url_for('serve_png', group=primary_group, filename=image.filename, v=image.version) }}"{% endif %}
                            alt="Forecast {{ primary_group }}"
                            class="panel-image{% if not image %} is-hidden{% endif %}"
                        >
                        <div class="empty{% if image %} is-hidden{% endif %}">No image for {{ primary_group }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="slider-controls">
                <input type="range" class="slider-bar" min="0" max="{{ slides|length - 1 }}" value="0" id="sliderBar">
                <div class="forecast-hour" id="forecastHour">Forecast Hour: 000</div>
            </div>
        </div>
    </div>
    <script id="slideData" type="application/json">{{ slides | tojson }}</script>
    <script id="defaultPanelGroups" type="application/json">{{ default_panel_groups | tojson }}</script>
    <script id="groupLabels" type="application/json">{{ group_labels | tojson }}</script>
    <script>
        const sliderContainer = document.querySelector('.slider-container');
        const slideDataElement = document.getElementById('slideData');
        const defaultPanelGroupsElement = document.getElementById('defaultPanelGroups');
        const groupLabelsElement = document.getElementById('groupLabels');
        const primaryGroupSelect = document.getElementById('primaryGroupSelect');
        const modeToggle = document.getElementById('modeToggle');
        const compareToggle = document.getElementById('compareToggle');
        const COMPARE_GROUP = 'main_NWP';
        const TOTAL_PRECIP_GROUP = 'total_precip';
        let slideData = slideDataElement ? JSON.parse(slideDataElement.textContent) : [];
        const defaultPanelGroups = defaultPanelGroupsElement ? JSON.parse(defaultPanelGroupsElement.textContent) : [];
        const groupLabels = groupLabelsElement ? JSON.parse(groupLabelsElement.textContent) : {};
        const allGroups = primaryGroupSelect ? Array.from(primaryGroupSelect.options).map((option) => option.value) : [];
        const DEFAULT_PRIMARY_GROUP = defaultPanelGroups[0] || allGroups[0] || '';
        const sliderBar = document.getElementById('sliderBar');
        const forecastHour = document.getElementById('forecastHour');
        let lastSlideSignature = JSON.stringify(slideData);
        const REFRESH_INTERVAL_MS = 30000;
        const PRIMARY_GROUP_KEY = 'adkwx-primary-group-v1';
        const COMPARE_MODE_KEY = 'adkwx-compare-main-nwp-v1';
        let selectedPrimaryGroup = DEFAULT_PRIMARY_GROUP;
        let compareWithMainNwp = false;
        let slideElements = [];
        let currentSlideIndex = 0;

        function saveSelectedPrimaryGroup() {
            try {
                window.localStorage.setItem(PRIMARY_GROUP_KEY, selectedPrimaryGroup);
            } catch (error) {
                console.warn('Failed to save primary group', error);
            }
        }

        function saveCompareMode() {
            try {
                window.localStorage.setItem(COMPARE_MODE_KEY, String(compareWithMainNwp));
            } catch (error) {
                console.warn('Failed to save compare mode', error);
            }
        }

        function formatGroupLabel(group) {
            if (groupLabels[group]) {
                return groupLabels[group];
            }
            return group.replaceAll('_', ' / ');
        }

        function syncToolbarControls() {
            if (primaryGroupSelect && primaryGroupSelect.value !== selectedPrimaryGroup) {
                primaryGroupSelect.value = selectedPrimaryGroup;
            }

            const totalPrecipAvailable = allGroups.includes(TOTAL_PRECIP_GROUP);
            const showingTotalPrecip = selectedPrimaryGroup === TOTAL_PRECIP_GROUP;

            if (modeToggle) {
                modeToggle.disabled = !totalPrecipAvailable;
                modeToggle.classList.toggle('is-active', showingTotalPrecip);
                modeToggle.textContent = !totalPrecipAvailable
                    ? 'Total Precip Unavailable'
                    : (showingTotalPrecip ? 'Show Main NWP' : 'Show Total Precip');
                modeToggle.setAttribute('aria-pressed', String(showingTotalPrecip));
            }

            const compareDisabled = selectedPrimaryGroup === COMPARE_GROUP;
            if (compareDisabled) {
                compareWithMainNwp = false;
            }

            if (compareToggle) {
                compareToggle.disabled = compareDisabled;
                compareToggle.classList.toggle('is-active', compareWithMainNwp && !compareDisabled);
                compareToggle.textContent = compareDisabled
                    ? 'Compare unavailable for Main NWP'
                    : (compareWithMainNwp ? 'Hide Main NWP Compare' : 'Compare to Main NWP');
                compareToggle.setAttribute('aria-pressed', String(compareWithMainNwp && !compareDisabled));
            }
        }

        function createPanelElement(slide, group) {
            const imageData = group ? slide.images[group] : null;

            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.dataset.group = group;

            const panelHeader = document.createElement('div');
            panelHeader.className = 'panel-header';

            const panelLabel = document.createElement('div');
            panelLabel.className = 'panel-label';
            panelLabel.textContent = formatGroupLabel(group);

            panelHeader.appendChild(panelLabel);

            const image = document.createElement('img');
            image.className = 'panel-image';
            image.alt = `Forecast ${formatGroupLabel(group)}`;

            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = `No image for ${formatGroupLabel(group)}`;

            if (imageData) {
                image.src = buildImageUrl(group, imageData);
                empty.classList.add('is-hidden');
            } else {
                image.classList.add('is-hidden');
            }

            panel.appendChild(panelHeader);
            panel.appendChild(image);
            panel.appendChild(empty);
            return panel;
        }

        function updateSlidePanels(index) {
            const slide = slideElements[index];
            const data = slideData[index];
            if (!slide || !data) {
                return;
            }

            slide.innerHTML = '';
            slide.classList.toggle('is-compare', compareWithMainNwp && selectedPrimaryGroup !== COMPARE_GROUP);
            slide.appendChild(createPanelElement(data, selectedPrimaryGroup));

            if (compareWithMainNwp && selectedPrimaryGroup !== COMPARE_GROUP) {
                slide.appendChild(createPanelElement(data, COMPARE_GROUP));
            }
        }

        function renderSlides() {
            syncToolbarControls();
            currentSlideIndex = Math.min(currentSlideIndex, Math.max(slideData.length - 1, 0));
            sliderContainer.innerHTML = '';

            slideData.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = 'slide';
                slideElement.dataset.index = slide.index;
                if (index === currentSlideIndex) {
                    slideElement.classList.add('active');
                }

                sliderContainer.appendChild(slideElement);
            });

            slideElements = Array.from(document.querySelectorAll('.slide'));
            sliderBar.max = String(Math.max(slideData.length - 1, 0));
            sliderBar.value = String(currentSlideIndex);

            if (slideElements.length) {
                showSlide(currentSlideIndex);
            } else {
                forecastHour.textContent = 'Forecast Hour: N/A';
            }
        }

        function buildImageUrl(group, image) {
            const filename = encodeURIComponent(image.filename);
            return `/pngs/${encodeURIComponent(group)}/${filename}?v=${encodeURIComponent(image.version)}`;
        }

        function updateSlidePanels(index) {
            const slide = slideElements[index];
            const data = slideData[index];
            if (!slide || !data) {
                return;
            }

            slide.innerHTML = '';
            slide.classList.toggle('is-compare', compareWithMainNwp && selectedPrimaryGroup !== COMPARE_GROUP);
            slide.appendChild(createPanelElement(data, selectedPrimaryGroup));

            if (compareWithMainNwp && selectedPrimaryGroup !== COMPARE_GROUP) {
                slide.appendChild(createPanelElement(data, COMPARE_GROUP));
            }
        }

        function formatIndex(idx) {
            return (/^\d+$/).test(idx) ? String(idx).padStart(3,'0') : idx;
        }

        function showSlide(index) {
            currentSlideIndex = Math.min(index, Math.max(slideElements.length - 1, 0));
            slideElements.forEach((s, i) => s.classList.toggle('active', i === index));
            const idx = slideElements[currentSlideIndex] && slideElements[currentSlideIndex].dataset.index ? slideElements[currentSlideIndex].dataset.index : '';
            forecastHour.textContent = `Forecast Hour: ${formatIndex(idx)}`;
            updateSlidePanels(currentSlideIndex);
        }

        async function refreshSlideData() {
            try {
                const response = await fetch('/slide-data', {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                });
                if (!response.ok) {
                    return;
                }

                const payload = await response.json();
                const nextSlides = Array.isArray(payload.slides) ? payload.slides : [];
                const nextSignature = JSON.stringify(nextSlides);
                if (nextSignature !== lastSlideSignature) {
                    slideData = nextSlides;
                    lastSlideSignature = nextSignature;
                    renderSlides();
                } else {
                    slideData = nextSlides;
                    updateSlidePanels(currentSlideIndex);
                }
            } catch (error) {
                console.error('Failed to refresh slide data', error);
            }
        }

        sliderBar.addEventListener('input', (event) => {
            showSlide(parseInt(event.target.value, 10));
        });

        if (primaryGroupSelect) {
            primaryGroupSelect.addEventListener('input', (event) => {
                selectedPrimaryGroup = event.target.value;
                if (selectedPrimaryGroup === COMPARE_GROUP) {
                    compareWithMainNwp = false;
                }
                saveSelectedPrimaryGroup();
                saveCompareMode();
                renderSlides();
            });
        }

        if (modeToggle) {
            modeToggle.addEventListener('click', () => {
                if (!allGroups.includes(TOTAL_PRECIP_GROUP)) {
                    return;
                }
                selectedPrimaryGroup = selectedPrimaryGroup === TOTAL_PRECIP_GROUP ? COMPARE_GROUP : TOTAL_PRECIP_GROUP;
                if (selectedPrimaryGroup === COMPARE_GROUP) {
                    compareWithMainNwp = false;
                }
                saveSelectedPrimaryGroup();
                saveCompareMode();
                renderSlides();
            });
        }

        if (compareToggle) {
            compareToggle.addEventListener('click', () => {
                if (selectedPrimaryGroup === COMPARE_GROUP) {
                    return;
                }
                compareWithMainNwp = !compareWithMainNwp;
                saveCompareMode();
                renderSlides();
            });
        }

        // initialize
        saveSelectedPrimaryGroup();
        saveCompareMode();
        renderSlides();
        window.setInterval(refreshSlideData, REFRESH_INTERVAL_MS);
    </script>
</body>
</html>
